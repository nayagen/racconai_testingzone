<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Enterprise calm sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#f6f7f9;font-family:"Segoe UI",Arial,sans-serif;color:#101828}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;background:#fff;border-bottom:1px solid #e4e7ec}
.nav b{font-size:24px;font-weight:700}.nav span{font-size:15px;margin-left:32px;color:#475467}
.nav a{background:#101828;color:#fff;padding:12px 22px;font-weight:600;text-decoration:none;border-radius:6px}
.map{position:absolute;left:0;right:0;top:72px;height:540px;background:#dfe5ec}
.map svg{position:absolute;inset:0}
.box{position:absolute;left:64px;top:140px;width:620px;background:#fff;padding:40px;border-radius:12px}
h1{font-size:60px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.box a{display:inline-block;margin-top:28px;background:#101828;color:#fff;padding:18px 30px;font-size:22px;font-weight:600;text-decoration:none;border-radius:8px}
.kpi{position:absolute;left:64px;right:64px;top:650px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.kpi div{background:#fff;border-radius:12px;padding:24px;height:180px}
.kpi b{display:block;font-size:48px;font-weight:700}.kpi span{font-size:22px;color:#475467}
</style></head><body>
<div class="nav"><div><b>RaccoonAI</b><span>Платформа</span><span>Sentinel</span><span>Для акиматов</span></div><a href="#">Запросить демо</a></div>
<div class="map"><svg width="1440" height="540" aria-hidden="true"><g fill="#2e90fa"><circle cx="900" cy="200" r="8"/><circle cx="1040" cy="320" r="8"/><circle cx="1180" cy="160" r="8"/><circle cx="980" cy="420" r="8"/></g><g fill="#f04438"><circle cx="1120" cy="420" r="8"/></g></svg></div>
<div class="box"><h1>Вывоз отходов города — под контролем</h1><a href="#">Запросить демо</a></div>
<div class="kpi"><div><b>[X%]</b><span>автоназначенных маршрутов</span></div><div><b>[N]</b><span>машин на платформе</span></div><div><b>[N]</b><span>заданий в месяц</span></div><div><b>2</b><span>города в пилоте</span></div></div>
</body></html>
