<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Canon sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:Arial,sans-serif;color:#111827}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;border-bottom:1px solid #e5e7eb}
.nav b{font-size:26px}.nav a{background:#2563eb;color:#fff;padding:12px 24px;font-weight:700;text-decoration:none;border-radius:8px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:96px 64px}
h1{font-size:64px;line-height:1.05;font-weight:800}
.cta{margin-top:40px;display:flex;gap:16px}.cta a{padding:18px 32px;font-size:22px;font-weight:700;text-decoration:none;border-radius:8px}
.p{background:#2563eb;color:#fff}.s{border:2px solid #d1d5db;color:#111827}
.shot{height:460px;border-radius:16px;background:#f3f4f6;border:1px solid #e5e7eb;padding:24px;display:grid;grid-template-columns:200px 1fr;gap:16px}
.shot div{background:#e5e7eb;border-radius:8px}
.logos{display:flex;gap:64px;padding:0 64px;font-size:24px;color:#4b5563;font-weight:700}
</style></head><body>
<div class="nav"><b>RaccoonAI</b><a href="#">Запросить демо</a></div>
<div class="hero"><div><h1>AI-платформа для вывоза отходов</h1><div class="cta"><a class="p" href="#">Запросить демо</a><a class="s" href="#">Продукты</a></div></div>
<div class="shot"><div></div><div></div></div></div>
<div class="logos"><span>Алматы</span><span>Астана</span><span>Ак Тартып</span></div>
</body></html>
