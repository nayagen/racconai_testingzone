<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Livery sketch</title>
<style>
*{box-sizing:border-box;margin:0}

.dash{border:4px dashed #5b2fd6;color:#5b2fd6!important;background:#fff}

.p{background:#121212;color:#fff}.s{border:4px solid #121212;color:#121212}
.right{position:absolute;right:64px;top:232px;width:420px;font-size:24px;line-height:1.35;font-weight:700}
